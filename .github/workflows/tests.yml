name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-latest
    steps:
      # In a tap repo this also checks the repo out, links it in as robertjndw/tap and trusts
      # it. Don't add actions/checkout on top: its auth header clashes with this one and
      # GitHub answers the fetch with a 400.
      - uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ github.token }}

      - name: Style
        run: brew style robertjndw/tap

      # Audit only, never install: casks target macOS 27 and the hosted
      # runners are older, so an install would fail the macOS requirement.
      # github_prerelease_version is skipped because every Archipel release
      # is still a GitHub prerelease; drop the flag once a stable one ships.
      - name: Audit casks
        run: |
          for cask in Casks/*.rb; do
            brew audit --cask --strict --online \
              --except github_prerelease_version "robertjndw/tap/$(basename "$cask" .rb)"
          done
